<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ユーザー情報表示ツール</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 p-8">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-4">GitHubユーザー情報表示ツール</h1>
            <div class="flex gap-2 mb-6">
                <input
                    id="usernameInput"
                    type="text"
                    placeholder="GitHubのユーザー名を入力してね"
                    class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                <button
                    id="searchButton"
                    class="mt-2 rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700 disabled:opacity-50"
                >検索</button>
            </div>
            <div id="result"></div>
        </div>

    <script>
        const usernameInput = document.getElementById("usernameInput");
        const searchButton = document.getElementById("searchButton");
        const result = document.getElementById("result");

        // メッセージ（エラーなど）を表示する
        function showMessage(text, colorClass) {
            result.textContent = "";
            const message = document.createElement("p");
            message.className = colorClass;
            message.textContent = text;
            result.appendChild(message);
        }

        // ユーザー情報のカードを表示する
        function showUser(user) {
            result.textContent = "";

            const card = document.createElement("div");
            card.className = "bg-white rounded-lg shadow p-6 flex flex-col items-center text-center";   
            
            const avatar = document.createElement("img");
            avatar.src = user.avatar_url;
            avatar.alt = user.login + " のアバター画像";
            avatar.className = "w-28 h-28 rounded-full mb-4";

            // name は未設定（null）のユーザーもいるので、その場合は login を表示する
            const name = document.createElement("h2");
            name.className = "text-xl font-bold";
            name.textContent = user.name || user.login;

            const bio = document.createElement("p");
            bio.className = "text-gray-600 mb-4";
            bio.textContent = user.bio || "自己紹介はありません";

            const followers = document.createElement("p");
            followers.className = "text-gray-600";
            followers.textContent = "フォロワー: " + user.followers + " 人";

            card.appendChild(avatar);
            card.appendChild(name);
            card.appendChild(bio);
            card.appendChild(followers);
            result.appendChild(card);
        }

        async function searchUser() {
            const username = usernameInput.value.trim();
            if (!username) {
                showMessage("ユーザー名を入力してください", "text-red-500");
                return;
            }

            searchButton.disabled = true;
            showMessage("検索中...", "text-gray-500");

            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                if (!response.ok) {
                    throw new Error("ユーザーが見つかりませんでした");
                }
                const user = await response.json();

                console.log(user); 
                // デバッグ用にユーザー情報をコンソールに表示
                showUser(user);
            } catch (error) {
                showMessage(error.message, "text-red-500");
            } finally {
                searchButton.disabled = false;
            }
        }
        
        searchButton.addEventListener("click", searchUser);
        usernameInput.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                searchUser();
            }
        });

    </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto">
      <h1 class="text-2xl font-bold mb-6">GitHubユーザー情報表示ツール</h1>

      <div class="flex gap-2 mb-6">
        <input
          id="usernameInput"
          type="text"
          placeholder="GitHubのユーザー名を入力"
          class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
        <button
          id="searchButton"
          class="rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700 disabled:opacity-50"
        >
          検索
        </button>
      </div>

      <div id="result"></div>
    </div>

    <script>
      const usernameInput = document.getElementById("usernameInput");
      const searchButton = document.getElementById("searchButton");
      const result = document.getElementById("result");

      // メッセージ（エラーなど）を表示する
      function showMessage(text, colorClass) {
        result.textContent = "";
        const message = document.createElement("p");
        message.className = colorClass;
        message.textContent = text;
        result.appendChild(message);
      }

      // ユーザー情報のカードを表示する
      function showUser(user) {
        result.textContent = "";

        const card = document.createElement("div");
        card.className = "bg-white rounded-lg shadow p-6 flex flex-col items-center text-center";

        const avatar = document.createElement("img");
        avatar.src = user.avatar_url;
        avatar.alt = user.login + " のアバター画像";
        avatar.className = "w-28 h-28 rounded-full mb-4";

        // name は未設定（null）のユーザーもいるので、その場合は login を表示する
        const name = document.createElement("h2");
        name.className = "text-xl font-bold";
        name.textContent = user.name || user.login;

        // bio も null の場合がある
        const bio = document.createElement("p");
        bio.className = "text-gray-600 mt-2";
        bio.textContent = user.bio || "自己紹介は設定されていません";

        const followers = document.createElement("p");
        followers.className = "mt-4 text-sm text-gray-800";
        followers.textContent = "フォロワー: " + user.followers + " 人";

        card.appendChild(avatar);
        card.appendChild(name);
        card.appendChild(bio);
        card.appendChild(followers);
        result.appendChild(card);
      }

      async function searchUser() {
        const username = usernameInput.value.trim();

        if (username === "") {
          showMessage("ユーザー名を入力してください。", "text-gray-600");
          return;
        }

        searchButton.disabled = true;
        showMessage("読み込み中...", "text-gray-600");

        try {
          const response = await fetch(
            "https://api.github.com/users/" + encodeURIComponent(username)
          );

          // 存在しないユーザー名（404など）は response.ok が false になる
          if (!response.ok) {
            showMessage("ユーザーが見つかりませんでした", "text-red-600");
            return;
          }

          const user = await response.json();

          // まずConsoleで確認して、使うプロパティを決める
          console.log(user);

          showUser(user);
        } catch (error) {
          // ネットワークエラーなど、fetch自体が失敗した場合
          showMessage("データの取得に失敗しました。", "text-red-600");
          console.error(error);
        } finally {
          searchButton.disabled = false;
        }
      }

      searchButton.addEventListener("click", searchUser);

      // Enterキーでも検索できるようにする
      usernameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          searchUser();
        }
      });
    </script>
  </body>
</html>
